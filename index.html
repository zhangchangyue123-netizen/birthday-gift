<body>

    <!-- Scene01 -->
    <section id="scene01">

        <!-- 木桌背景 -->
        <div class="desk"></div>

        <!-- 投影光 -->

        <!-- 暗角 -->

        <!-- 胶片颗粒 -->
        <div class="grain"></div>

        <!-- 拍立得 -->
        <div class="polaroid">

            <div class="photo">

                <img
                    src="assets/images/photo1.jpg"
                    alt="Photo">

            </div>

            <div class="photo-date">

                2025.05.03

            </div>

        </div>

        <!-- Frame -->

        <div class="frame-number">

            FRAME 01

        </div>

        <!-- Scroll -->

        <div class="scroll">

            <div class="line"></div>

        </div>
